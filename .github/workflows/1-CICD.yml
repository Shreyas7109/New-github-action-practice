name: 1st CICD pipeline basic flow

on:
  workflow_dispatch:

jobs:
  Code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Clone the code"
  Build:
    needs: [Code]
    runs-on: ubuntu-latest
    steps:
      - name: Build using Docker
        run: echo "Building the code using Docker"
  Test:
    needs: [Build]
    runs-on: ubuntu-latest
    steps:
      - name: Running test case
        run: echo "Testing the app"

  Deploy:
    needs: [Build, Test] 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the code
        run: echo "Deploying the code"
